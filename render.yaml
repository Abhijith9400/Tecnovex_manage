# Render Blueprint for a hosted TEST environment: PostgreSQL + the API (backend/).
# The frontend runs on Vercel and forwards /api/v1/* here (see frontend/next.config.ts).
#
# Values marked `sync: false` are entered in the Render dashboard when the Blueprint is created
# (passwords are never stored in this repo).
#
# Free-plan limits (fine for testing): the API sleeps after ~15 min idle (first request takes ~1 min),
# uploaded files are lost on every redeploy/restart (no persistent disk), and the free database expires after 30 days.

databases:
  - name: tecnovex-db
    plan: free
    databaseName: agency_management
    user: tecnovex

services:
  - type: web
    name: tecnovex-api
    runtime: node
    plan: free
    rootDir: backend
    # Dev dependencies are needed at runtime for `prisma migrate deploy` and the seed (tsx).
    buildCommand: npm ci --include=dev && npm run build
    # Apply migrations, create the admin/base data if missing (safe to repeat), then start.
    startCommand: npx prisma migrate deploy && npx prisma db seed && npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: tecnovex-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # Vercel rewrite + Render load balancer.
      - key: TRUST_PROXY
        value: "2"
      # Your Vercel address, e.g. https://tecnovex-manage.vercel.app (add it after the frontend is deployed).
      - key: CORS_ORIGIN
        sync: false
      - key: SEED_ADMIN_EMAIL
        value: abhijith@tecnovexdigital.com
      - key: SEED_ADMIN_PASSWORD
        sync: false
      # Clearly fictional sample clients/invoices/employees, handy for testing. Set to "false" to start empty.
      - key: SEED_SAMPLE_DATA
        value: "true"
      - key: LOGIN_OTP_ENABLED
        value: "true"
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        value: tecnovexacc@gmail.com
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        value: Tecnovex Digital Solutions <tecnovexacc@gmail.com>
      - key: MAX_UPLOAD_MB
        value: "100"
